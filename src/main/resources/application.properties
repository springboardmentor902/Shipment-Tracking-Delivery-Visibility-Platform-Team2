spring.application.name=shiptrack-pro

spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shiptrack_pro_infosys}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always

server.port=8081

# Analytics results are cached in Redis for ten minutes.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# All credentials are deliberately provided through the environment.
jwt.secret=${JWT_SECRET:${JWT_SECRET_KEY:}}

# Google Maps integration. Leave GOOGLE_MAPS_API_KEY unset to save routes without
# automatic distance/ETA enrichment.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.geocoding-url=https://maps.googleapis.com/maps/api/geocode/json
google.maps.directions-url=https://maps.googleapis.com/maps/api/directions/json

# Geoapify is used when Google Maps is unavailable.
geoapify.geocoding-api-key=${GEOAPIFY_GEOCODING_API_KEY:}
geoapify.routing-api-key=${GEOAPIFY_ROUTING_API_KEY:}
geoapify.country-code=${GEOAPIFY_COUNTRY_CODE:in}
geoapify.geocoding-url=https://api.geoapify.com/v1/geocode/search
geoapify.routing-url=https://api.geoapify.com/v1/routing

# Email delivery is best-effort: notification records are retained when delivery fails.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@shiptrack.local}

# Local POD files are intentionally outside source control.
app.upload-dir=${POD_UPLOAD_DIR:uploads}
app.notification.dedupe-minutes=${NOTIFICATION_DEDUPE_MINUTES:${NOTIFICATION_DUPLICATE_WINDOW_MINUTES:30}}
app.eta.delay-risk-threshold=${ETA_DELAY_RISK_THRESHOLD:7.0}
app.eta.scheduler-enabled=${ETA_SCHEDULER_ENABLED:true}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
