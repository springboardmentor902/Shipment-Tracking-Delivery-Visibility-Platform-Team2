spring.application.name=shiptrack-pro

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shiptrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8081

# All credentials are deliberately provided through the environment.
jwt.secret=${JWT_SECRET}

# Google Maps integration. Leave GOOGLE_MAPS_API_KEY unset to save routes without
# automatic distance/ETA enrichment.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.geocoding-url=https://maps.googleapis.com/maps/api/geocode/json
google.maps.directions-url=https://maps.googleapis.com/maps/api/directions/json

# Email delivery is best-effort: notification records are retained when delivery fails.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@shiptrack.local}

# Local POD files are intentionally outside source control.
app.upload-dir=${POD_UPLOAD_DIR:uploads}
app.notification.dedupe-minutes=${NOTIFICATION_DEDUPE_MINUTES:30}
app.eta.delay-risk-threshold=${ETA_DELAY_RISK_THRESHOLD:7.0}
app.eta.scheduler-enabled=${ETA_SCHEDULER_ENABLED:true}
